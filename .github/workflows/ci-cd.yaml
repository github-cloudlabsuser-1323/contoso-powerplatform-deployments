name: Power Platform CI/CD

on:
  push:
    branches:
      - develop

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ✅ Use Microsoft's official CLI installer to avoid node issues
      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/setup-cli@v1

      # 🔐 Authenticate with Service Principal
      - name: Authenticate with Power Platform
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          pac auth create --name "Contoso-PP-BuildTools" \
                          --applicationId "$AZURE_CLIENT_ID" \
                          --clientSecret "$AZURE_CLIENT_SECRET" \
                          --tenant "$AZURE_TENANT_ID"

      - name: List PAC Auth Profiles (Debug Step)
        run: pac auth list

      - name: Validate Solution
        run: |
          pac solution validate --path "./solution_export" --solutionName "ContosoSolution" --target "test"

      - name: Deploy to Test Environment
        run: |
          pac solution deploy --path "./solution_export" --solutionName "ContosoSolution" --target "test"
