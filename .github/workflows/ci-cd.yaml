name: Power Platform CI/CD

on:
  push:
    branches:
      - develop

jobs:
  build-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js (v14 - compatible with pac)
        uses: actions/setup-node@v3
        with:
          node-version: '14'

      - name: Install Power Platform CLI
        run: npm install -g pac@latest

      - name: Authenticate with Power Platform
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        shell: pwsh
        run: |
          pac auth clear
          pac auth create `
            --url 'https://orgc7fa0d66.crm.dynamics.com/' `
            --applicationId $env:AZURE_CLIENT_ID `
            --clientSecret $env:AZURE_CLIENT_SECRET `
            --tenant $env:AZURE_TENANT_ID `
            --name 'Contoso-PP-BuildTools'

      - name: Validate Solution
        shell: pwsh
        run: |
          pac solution validate `
            --path ".\\solution_export" `
            --solutionName "ContosoSolution" `
            --target "test"

      - name: Deploy to Test Environment
        shell: pwsh
        run: |
          pac solution deploy `
            --path ".\\solution_export" `
            --solutionName "ContosoSolution" `
            --target "test"
