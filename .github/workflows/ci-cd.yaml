name: Power Platform CI/CD

on:
  push:
    branches:
      - develop

env:
  ACTIONS_STEP_DEBUG: true
  ACTIONS_RUNNER_DEBUG: true

jobs:
  build-deploy:
    runs-on: windows-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Setup Node.js (Recommended LTS)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # Tested LTS version with PAC

      # Step 3: Install Power Platform CLI
      - name: Install Power Platform CLI
        run: npm install -g pac@1.28.6  # Compatible stable version

      # Step 4: Authenticate with Power Platform using Service Principal
      - name: Authenticate with Power Platform (Service Principal)
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          echo "Debug: Verifying Node and PAC versions"
          node --version
          npm --version
          pac --version

          echo "Debug: Checking if secrets are passed"
          [ -n "$AZURE_CLIENT_ID" ] && echo "✅ Client ID is set" || echo "❌ Client ID is empty"
          [ -n "$AZURE_TENANT_ID" ] && echo "✅ Tenant ID is set" || echo "❌ Tenant ID is empty"
          [ -n "$AZURE_CLIENT_SECRET" ] && echo "✅ Client Secret is set" || echo "❌ Client Secret is empty"

          echo "Debug: Authenticating with PAC CLI"
          pac auth clear
          pac auth create --name Contoso-BuildTools \
            --applicationId "$AZURE_CLIENT_ID" \
            --clientSecret "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID"

          echo "Debug: Current Auth Profile:"
          pac auth list

      # Step 5: Validate the solution before deployment
      - name: Validate Power Platform Solution
        run: |
          echo "Validating solution..."
          pac solution validate --path ".\\solution_export" --solutionName "ContosoSolution" --target "test"

      # Step 6: Deploy the solution to test environment
      - name: Deploy to Test Environment
        run: |
          echo "Deploying solution to test environment..."
          pac solution deploy --path ".\\solution_export" --solutionName "ContosoSolution" --target "test"
