name: Power Platform CI/CD

on:
  push:
    branches:
      - develop

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '14'  # Use Node 14 to avoid "primordials" error
      
      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/setup@v1

      - name: Authenticate with Power Platform using Service Principal
        env:
          AZURE_APPLICATION_ID: ${{ secrets.AZURE_APPLICATION_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          pac auth create --name Contoso-PP-BuildTools \
            --applicationId $AZURE_APPLICATION_ID \
            --clientSecret $AZURE_CLIENT_SECRET \
            --tenant $AZURE_TENANT_ID 
      - name: Validate Solution
        run: |
          pac solution validate --path "./solution_export" --solutionName "ContosoSolution" --target "test"
      
      - name: Deploy to Test Environment
        run: |
          pac solution deploy --path "./solution_export" --solutionName "ContosoSolution" --target "test"

