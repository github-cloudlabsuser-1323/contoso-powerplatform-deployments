name: Power Platform CI/CD
on:
  push:
    branches:
      - develop
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          
      - name: Install Power Platform CLI
        run: npm install -g @microsoft/powerplatform-cli-wrapper @microsoft/powerapps-cli
        
      - name: Authenticate with PAC CLI
        run: |
          # Authenticate using Service Principal
          pac auth create --kind ServicePrincipal \
          --environment "https://orgc7fa0d66.crm.dynamics.com/" \
          --applicationId ${{ secrets.AZURE_CLIENT_ID }} \
          --clientSecret ${{ secrets.AZURE_CLIENT_SECRET }} \
          --tenant ${{ secrets.AZURE_TENANT_ID }}
        shell: bash
      
      - name: List solutions directory
        run: |
          ls -la
          ls -la ./solution_export || echo "solution_export directory not found"
      
      - name: Pack solution
        run: |
          # Assuming you have a solution folder with unpacked solution
          # If you already have a zipped solution, you can skip this step
          mkdir -p ./solution_output
          pac solution pack --zipfile ./solution_output/ContosoSolution.zip --folder ./solution_export --packagetype Both
          
      - name: Check solution file
        run: |
          ls -la ./solution_output
          
      - name: Import solution to environment
        run: |
          pac solution import --path ./solution_output/ContosoSolution.zip --async false --activate-plugins
          
      - name: Publish customizations
        run: |
          pac solution publish
