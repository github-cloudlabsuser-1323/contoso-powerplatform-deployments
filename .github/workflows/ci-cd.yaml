name: Power Platform CI/CD
on:
  push:
    branches:
      - develop
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      # Use the Power Platform tool installer action
      - name: Power Platform Tool Installer
        uses: microsoft/powerplatform-actions/tool-installer@v0
      
      # Authenticate using a service principal
      - name: Power Platform Auth
        uses: microsoft/powerplatform-actions/auth@v0
        with:
          environment-url: "https://orgc7fa0d66.crm.dynamics.com/"
          app-id: ${{ secrets.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      
      - name: List solutions directory
        run: |
          ls -la
          ls -la ./solution_export || echo "solution_export directory not found"
      
      # Pack solution if needed
      - name: Pack Solution
        uses: microsoft/powerplatform-actions/pack-solution@v0
        with:
          solution-folder: ./solution_export
          solution-file: ./solution_output/ContosoSolution.zip
          solution-type: Both
      
      # Check the output directory
      - name: Check solution file
        run: |
          ls -la ./solution_output || echo "Solution output directory not found"
      
      # Import the solution
      - name: Import Solution
        uses: microsoft/powerplatform-actions/import-solution@v0
        with:
          environment-url: "https://orgc7fa0d66.crm.dynamics.com/"
          solution-file: ./solution_output/ContosoSolution.zip
          force-overwrite: true
          publish-changes: true
