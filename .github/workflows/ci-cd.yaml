name: Power Platform CI/CD

on:
  push:
    branches:
      - develop

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install .NET Core SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Install Power Platform CLI
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
        shell: bash

      - name: Authenticate to Power Platform
        uses: microsoft/powerplatform-actions/auth@v1.5.2
        with:
          app-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          environment-url: "https://orgXYZ.crm.dynamics.com"
 
      
      - name: Check Solution Path
        run: |
          ls -la
      
      - name: Deploy to Test Environment
        run: |
          pac solution deploy --path "./solution_export" --solutionName "ContosoSolution" --target "test"
