name: Power Platform CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install npm packages with shrinkwrap
        run: npm install

      - name: Install Power Platform CLI
        run: npm install -g pac@latest

      - name: Validate pac install
        run: pac --version

      # Add your actual Power Platform steps here
      # e.g., auth, export, import, etc.
