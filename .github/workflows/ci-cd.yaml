name: Power Platform CI/CD
on:
  push:
    branches:
      - develop
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # Updated to Node.js 18
          
      - name: Install Power Platform CLI
        run: |
          npm install -g @microsoft/powerapps-cli
        
      - name: Authenticate with PAC CLI
        run: |
          pac auth create --url "https://orgc7fa0d66.crm.dynamics.com/" \
          --name "GithubAuth" \
          --applicationId ${{ secrets.AZURE_CLIENT_ID }} \
          --clientSecret ${{ secrets.AZURE_CLIENT_SECRET }} \
          --tenant ${{ secrets.AZURE_TENANT_ID }}
        shell: bash
      
      - name: List solutions directory
        run: |
          ls -la
          ls -la ./solution_export || echo "solution_export directory not found"
      
      - name: Pack solution
        run: |
          # Assuming you have a solution folder with unpacked solution
          mkdir -p ./solution_output
          pac solution pack --zipfile ./solution_output/ContosoSolution.zip --folder ./solution_export --packagetype Both || echo "Solution packing failed, checking directory structure"
          
      - name: Check directory structure
        if: ${{ failure() }}
        run: |
          find . -type d | sort
          
      - name: Check solution file
        run: |
          ls -la ./solution_output || echo "Solution output directory not found"
          
      - name: Import solution to environment
        run: |
          pac solution import --path ./solution_output/ContosoSolution.zip --environment-url "https://orgc7fa0d66.crm.dynamics.com/" --async false --activate-plugins || echo "Import failed"
          
      - name: Publish customizations
        run: |
          pac solution publish --environment-url "https://orgc7fa0d66.crm.dynamics.com/"
