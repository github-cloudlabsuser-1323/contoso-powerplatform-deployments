name: Power Platform CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Create npm-shrinkwrap.json
        run: |
          cat > npm-shrinkwrap.json << 'EOF'
          {
            "dependencies": {
              "graceful-fs": {
                "version": "4.2.2"
              }
            }
          }
          EOF

      - name: Create package.json (if not exists)
        run: |
          if [ ! -f package.json ]; then
            echo '{ "name": "pp-solution", "version": "1.0.0", "dependencies": { "graceful-fs": "4.2.2" } }' > package.json
          fi

      - name: Install npm packages
        run: npm install

      - name: Install Power Platform CLI
        run: npm install -g pac@latest

      - name: Whoami to validate CLI
        run: pac --version

      # Add your additional steps here (solution import, export, etc.)

