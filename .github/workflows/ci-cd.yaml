name: Power Platform CI/CD

on:
  push:
    branches:
      - develop

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ✅ Install Power Platform CLI properly
      - name: Install Microsoft Power Platform CLI (PAC)
        run: |
          curl -L https://aka.ms/paclinux -o pacinstall.sh
          chmod +x pacinstall.sh
          ./pacinstall.sh

      # 🔐 Authenticate using Service Principal
      - name: Authenticate with Power Platform
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          pac auth create --name "Contoso-PP-BuildTools" \
                          --applicationId "$AZURE_CLIENT_ID" \
                          --clientSecret "$AZURE_CLIENT_SECRET" \
                          --tenant "$AZURE_TENANT_ID"

      - name: Debug Auth Profiles
        run: pac auth list
