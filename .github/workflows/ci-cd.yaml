name: Power Platform CI/CD

on:
  push:
    branches:
      - develop

jobs:
  build-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install Power Platform CLI
        run: npm install -g pac@latest

      - name: Authenticate with Power Platform
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          pac auth create --name Contoso-PP-BuildTools --applicationId 2fb0f645-b890-4367-adf0-05837a4ad6f9 --clientSecret omp8Q~q-5iE9M2p5bvYbSGA4ZCH26of6qLJIydnK --tenant ecdbacb9-a7b8-41cd-ab42-cf0d41acd4f3 

      - name: Validate Solution
        run: |
          pac solution validate --path ".\\solution_export" --solutionName "ContosoSolution" --target "test"

      - name: Deploy to Test Environment
        run: |
          pac solution deploy --path ".\\solution_export" --solutionName "ContosoSolution" --target "test"
